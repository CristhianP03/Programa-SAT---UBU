spring.application.name=sistema-bienestar-universitario

# ============================================================
# SERVIDOR
# ============================================================
server.port=8080
# Zona horaria del servidor (corte a medianoche local)
spring.jackson.time-zone=America/Guayaquil

# ============================================================
# SESIONES
# ============================================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
# En producción: cambiar a true (requiere HTTPS)
server.servlet.session.cookie.secure=false

# ============================================================
# BASE DE DATOS en PostgreSQL
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/unidad_bienestar_universitariov07
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# THYMELEAF
# ============================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ============================================================
# CORREO SMTP (Gmail)
# En producción: reemplazar las variables de entorno
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# ============================================================
# NOMBRE DE LA APLICACION
# ============================================================
app.nombre=Sistema de Bienestar Estudiantil UTEQ

# Nota: Los headers de seguridad HTTP se configuran en SecurityConfig.java
# mediante http.headers() para compatibilidad con Spring Boot 3.x + Tomcat embebido.