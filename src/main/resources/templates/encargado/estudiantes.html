<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Estudiantes</title><link rel="stylesheet" th:href="@{/css/uteq.css}"></head>
<body>
<div class="nav">
    <img th:src="@{/img/uteq-v1.png}" alt="UTEQ" class="nav-logo">
    <div class="links"><a th:href="@{/encargado/panel}">Cola</a><a th:href="@{/encargado/reporte}">Reporte</a><a th:href="@{/encargado/estudiantes}">Estudiantes</a><a th:href="@{/encargado/perfil}">Mi perfil</a><form class="logout-form" th:action="@{/auth/logout}" method="post"><button type="submit" class="logout-btn">Cerrar sesión</button></form></div>
</div>
<div class="content">
<h1>Estudiantes</h1>
<div class="error" th:if="${error}" th:text="${error}"></div>
<div class="success" th:if="${mensaje}" th:text="${mensaje}"></div>
<table>
<thead><tr><th>Cédula</th><th>Estudiante</th><th>Correo</th><th>Facultad</th><th>Carrera</th><th>Acción</th></tr></thead>
<tbody>
<tr th:each="e : ${estudiantes}">
<td th:text="${e.cedula}"></td>
<td th:text="${e.nombres + ' ' + e.apellidos}"></td>
<td th:text="${e.correoInstitucional}"></td>
<td th:text="${e.carrera != null && e.carrera.facultad != null ? e.carrera.facultad.nombre : '-'}"></td>
<td th:text="${e.carrera != null ? e.carrera.nombre : '-'}"></td>
<td><details><summary>Editar</summary>
<form th:action="@{/encargado/estudiantes/editar/{id}(id=${e.id})}" method="post">
<input type="text" name="nombres" th:value="${e.nombres}" required placeholder="Nombres">
<input type="text" name="apellidos" th:value="${e.apellidos}" required placeholder="Apellidos">
<input type="email" name="correo" th:value="${e.correoInstitucional}" required>
<small>Cédula bloqueada: <span th:text="${e.cedula}"></span></small>
<select name="sexoId" required><option th:each="s : ${sexos}" th:value="${s.id}" th:text="${s.nombre}" th:selected="${e.sexo != null and e.sexo.id == s.id}"></option></select>
<select name="etniaId" required><option th:each="et : ${etnias}" th:value="${et.id}" th:text="${et.nombre}" th:selected="${e.etnia != null and e.etnia.id == et.id}"></option></select>
<select name="carreraId" required><option th:value="${e.carrera != null ? e.carrera.id : ''}" th:text="${e.carrera != null ? e.carrera.nombre : ''}"></option></select>
<button type="submit" class="btn">Guardar</button>
</form></details></td>
</tr>
</tbody>
</table>
</div>
<div class="footer-version">Sistema de registro de turnos v1.0</div>
</body>
</html>
