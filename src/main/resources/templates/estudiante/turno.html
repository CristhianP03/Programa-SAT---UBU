<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Turno — Bienestar Estudiantil UTEQ</title>
    <link rel="stylesheet" th:href="@{/css/uteq.css}">
</head>
<body class="standalone">
    <div class="container center">
        <img th:src="@{/img/uteq-v2.png}" alt="UTEQ" class="logo-v2">
        <div class="icon">&#127919;</div>
        <h1 th:text="${turno != null ? 'Turno Asignado' : 'Tu Turno'}">Tu Turno</h1>

        <div class="success" th:if="${mensaje}" th:text="${mensaje}"></div>
        <div class="error" th:if="${error != null && posicion == null}" th:text="${error}"></div>

        <div class="turno-numero" th:if="${turno}" th:text="${turno}"></div>
        <p class="servicio-info" th:if="${area}" th:text="'Área: ' + ${area}"></p>
        <p class="servicio-info" th:if="${servicio}" th:text="'Servicio: ' + ${servicio}"></p>

        <div class="posicion" th:if="${posicion != null}">
            <span th:if="${posicion == 0}">Eres el siguiente en la cola.</span>
            <span th:if="${posicion > 0}">Hay <strong th:text="${posicion}"></strong> persona(s) antes que tu.</span>
        </div>

        <div class="info" th:if="${posicion != null}">Espera a ser llamado por el personal de bienestar.</div>

        <a th:if="${turno != null}" th:href="@{/estudiante/registro}" class="btn">Volver al inicio</a>
        <p class="info" style="margin-top:10px;font-size:0.9em;color:#666" th:if="${turno != null}">Si hay un error en tus datos, solicita la corrección al administrador.</p>
    </div>
    <div class="footer-version">Sistema de registro de turnos v1.0</div>
</body>
</html>
