<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/uteq.css}">
</head>
<body>
    <div class="nav">
        <img th:src="@{/img/uteq-v1.png}" alt="UTEQ" class="nav-logo">
        <div>
            <a th:href="@{/admin/dashboard}">Pantalla principal</a>
            <a th:href="@{/admin/reportes}">Reportes</a>
            <a th:href="@{/admin/estudiantes}">Estudiantes</a>
            <a th:href="@{/admin/usuarios}">Usuarios</a>
            <a th:href="@{/admin/servicios}">Servicios</a>
            <a th:href="@{/admin/perfil}">Mi perfil</a>
            <form class="logout-form" th:action="@{/auth/logout}" method="post">
                <button type="submit" class="logout-btn">Cerrar sesión</button>
            </form>
        </div>
    </div>
    <div class="content">
        <h1>Gestión de Usuarios</h1>

        <div class="error" th:if="${error}" th:text="${error}"></div>
        <div class="success" th:if="${mensaje}" th:text="${mensaje}"></div>

        <div class="form-section">
            <h2>Crear nuevo usuario</h2>
            <p class="info">El sistema genera una contraseña temporal automáticamente y la envía al correo del nuevo usuario.</p>
            <form th:action="@{/admin/usuarios/crear}" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nombres</label>
                        <input type="text" name="nombres" required maxlength="100">
                    </div>
                    <div class="form-group">
                        <label>Apellidos</label>
                        <input type="text" name="apellidos" required maxlength="100">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Usuario</label>
                        <input type="text" name="usuario" required maxlength="50"
                               placeholder="Nombre de usuario para el login">
                    </div>
                    <div class="form-group">
                        <label>Correo</label>
                        <input type="email" name="correo" required maxlength="100">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Rol</label>
                        <select name="rol" required>
                            <option value="ENCARGADO">Encargado</option>
                            <option value="ADMIN">Administrador</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Área</label>
                        <select name="areaId">
                            <option value="">Ninguna</option>
                            <option th:each="a : ${areas}" th:value="${a.id}" th:text="${a.nombre}"></option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn">Crear usuario</button>
            </form>
        </div>

        <table>
            <thead>
                <tr><th>Nombre</th><th>Usuario</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr>
            </thead>
            <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.nombres} + ' ' + ${u.apellidos}"></td>
                    <td th:text="${u.usuario}"></td>
                    <td th:text="${u.correo}"></td>
                    <td th:text="${u.rol}"></td>
                    <td th:text="${u.activo ? 'Activo' : 'Inactivo'}"></td>
                    <td>
                        <form th:if="${u.activo}" th:action="@{/admin/usuarios/desactivar/{id}(id=${u.id})}" method="post" style="display:inline">
                            <button type="submit" class="btn btn-danger"
                                    onclick="return confirm('¿Desactivar este usuario?')">Desactivar</button>
                        </form>
                        <form th:if="${!u.activo}" th:action="@{/admin/usuarios/activar/{id}(id=${u.id})}" method="post" style="display:inline">
                            <button type="submit" class="btn"
                                    onclick="return confirm('¿Reactivar este usuario?')">Reactivar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="footer-version">Sistema de registro de turnos v1.0</div>
</body>
</html>
